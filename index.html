<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Medloge-Enugu - Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main>

        <h1>Welcome Back to Medloge-Enugu</h1>

        <p>Let's get started</p>

        <form id="login-form">

            <input
                type="text"
                id="username"
                placeholder="Enter your username"
            >

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
            >

            <button type="submit">Login</button>

        </form>

        <p>
            New to Medloge?
            <a href="Account.html">Create Account</a>
        </p>

    </main>

    <footer>
        Most Trusted House-Rent App for Medical Students
    </footer>

    <script src="script.js"></script>

</body>

</html>
